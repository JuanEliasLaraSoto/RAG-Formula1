name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests del nucleo RAG (sin dependencias)
        run: python tests/test_rag.py
      - name: Tests de ingesta de datos
        run: python tests/test_data_ingest.py
